name: Build TERMULScan APK

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "TERMULSCAN branch/tag/commit to build"
        required: false
        default: "main"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.0"
          channel: stable
          cache: true

      - name: Checkout TERMULSCAN source
        env:
          SOURCE_REF: ${{ inputs.source_ref || 'main' }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$SOURCE_REF" \
            https://github.com/jntcargo053b-wq/TERMULSCAN.git termulscan-source

      - name: Verify fixed testing keystore
        working-directory: termulscan-source
        run: |
          set -euo pipefail
          test -f android/debug-fixed.keystore
          keytool -list \
            -keystore android/debug-fixed.keystore \
            -storepass termulscan-debug \
            -alias termulscan-debug >/dev/null
          echo "Fixed testing keystore: OK"

      - name: Get dependencies
        working-directory: termulscan-source
        run: flutter pub get

      - name: Analyze
        working-directory: termulscan-source
        run: flutter analyze

      - name: Test
        working-directory: termulscan-source
        run: flutter test

      - name: Build testing APK
        working-directory: termulscan-source
        run: flutter build apk --release

      - name: Verify APK
        working-directory: termulscan-source
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="testing-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            "termulscan-source/build/app/outputs/flutter-apk/app-release.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "TERMULScan Testing Build #${GITHUB_RUN_NUMBER}" \
            --notes "Automated testing APK built from jntcargo053b-wq/TERMULSCAN ref: $SOURCE_REF."
